apiVersion: v1
kind: Service
metadata:
  name: simpleapp-loadbalancer-service
  labels:
    app: simpleapp
    app.kubernetes.io/name: simpleapp
    app.kubernetes.io/version: "0.0.4"
spec:
  type: LoadBalancer
  selector:
    app: simpleapp
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
