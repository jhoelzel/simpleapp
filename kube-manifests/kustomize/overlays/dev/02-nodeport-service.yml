apiVersion: v1
kind: Service
metadata:
  name: simpleapp-nodeport-service
  labels:
    app: simpleapp
    app.kubernetes.io/name: simpleapp
    app.kubernetes.io/version: "0.0.5"
spec:
  type: NodePort
  selector:
    app: simpleapp
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
