apiVersion: v1
kind: Service
metadata:
  name: {{.APP_NAME}}-nodeport-service
  labels:
    app: {{.APP_NAME}}
    app.kubernetes.io/name: {{.APP_NAME}}
    app.kubernetes.io/version: "{{.VERSION}}"
spec:
  type: NodePort
  selector:
    app: {{.APP_NAME}}
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
